name: Rerun installed smoke from a prior installer

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: GitHub Actions run ID containing a debug-installer artifact
        type: string
        required: true
      platform:
        description: Installer target to download and test
        type: choice
        required: true
        options:
          - macos-arm64
          - windows-x64
          - linux-x64

      diagnostic_only:
        description: Diagnose only the pinned failed Windows installer; NEVER qualification
        type: boolean
        required: false
        default: false
      rpm_only:
        description: Qualify the source run's real RPM (platform must be linux-x64)
        type: boolean
        required: false
        default: false
      expected_commit:
        description: Exact artifact source commit (required when rpm_only)
        type: string
        required: false
        default: ''
      rpm_version:
        description: Exact RPM version (required when rpm_only)
        type: string
        required: false
        default: ''
      rpm_tag:
        description: Exact upstream inventory tag or build-COMMIT (required when rpm_only)
        type: string
        required: false
        default: ''

permissions:
  actions: read
  contents: read

jobs:
  smoke:
    if: ${{ !inputs.rpm_only && !inputs.diagnostic_only }}
    runs-on: ${{ inputs.platform == 'macos-arm64' && 'macos-15' || inputs.platform == 'windows-x64' && 'windows-2022' || 'ubuntu-22.04' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Linux smoke dependencies
        if: inputs.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 file gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav libayatana-appindicator3-1 libdbus-1-3 libgtk-3-0 libwebkit2gtk-4.1-0 libxdo3 pulseaudio xvfb
      - run: npm ci
      - name: Check installed-smoke path handling
        run: python scripts/release/test_smoke_installed.py
      - name: Check installed Native audio smoke protocol
        run: node --test scripts/release/native-audio-protocol.test.mjs
      - name: Resolve the source run commit
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          commit="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .head_sha)"
          test "${#commit}" -eq 40
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Download the selected platform installer from the source run
        uses: actions/download-artifact@v5
        with:
          pattern: debug-installer-${{ inputs.platform }}-*
          path: .cache/debug-installers
          merge-multiple: true
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Run current smoke checks against the preserved installer
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            macos-arm64) pattern='*.dmg' ;;
            windows-x64) pattern='*.exe' ;;
            linux-x64) pattern='*.deb' ;;
            *) echo "Unsupported platform: $PLATFORM" >&2; exit 1 ;;
          esac
          shopt -s nullglob
          installers=(.cache/debug-installers/$pattern)
          test "${#installers[@]}" -eq 1 || { echo "Expected one $pattern installer, found ${#installers[@]}" >&2; exit 1; }
          python scripts/release/smoke-installed.py \
            --installer "${installers[0]}" \
            --evidence .cache/release-smoke-evidence.json \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-commit "$SOURCE_COMMIT"
      - name: Check the preserved AppImage independently
        if: inputs.platform == 'linux-x64'
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(.cache/debug-installers/*.AppImage)
          test "${#installers[@]}" -eq 1
          chmod u+x "${installers[0]}"
          python scripts/release/smoke-installed.py --installer "${installers[0]}" \
            --evidence .cache/appimage-smoke-evidence.json \
            --source-run-id "$SOURCE_RUN_ID" --source-commit "$SOURCE_COMMIT"
      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('.cache/release-smoke-evidence.json') != ''
        with:
          name: smoke-rerun-evidence-${{ inputs.platform }}-${{ inputs.source_run_id }}
          path: |
            .cache/release-smoke-evidence.json
            .cache/appimage-smoke-evidence.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  rpm-inputs:
    if: inputs.rpm_only
    runs-on: ubuntu-22.04
    steps:
      - name: Require the Linux RPM platform
        env:
          RPM_PLATFORM: ${{ inputs.platform }}
        run: test "$RPM_PLATFORM" = linux-x64

  rpm-installed:
    needs: rpm-inputs
    if: inputs.rpm_only
    uses: ./.github/workflows/qualify-rpm.yml
    permissions:
      actions: read
      contents: read
    with:
      artifact_run_id: ${{ inputs.source_run_id }}
      source_commit: ${{ inputs.expected_commit }}
      version: ${{ inputs.rpm_version }}
      tag: ${{ inputs.rpm_tag }}

  windows-diagnostic:
    if: inputs.diagnostic_only
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact failed producer and download only its preserved NSIS
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          PLATFORM: ${{ inputs.platform }}
          RPM_ONLY: ${{ inputs.rpm_only }}
        run: |
          import hashlib,json,os,pathlib,subprocess,zipfile,stat
          root=pathlib.Path('.cache/windows-diagnostic');root.mkdir(parents=True)
          commit='3cf3b1a48709c4a102f7e06ac2ea6b15059b19b4'
          run_id=41349273407;artifact_id=13102717611
          digest='301d6a5942b90043c52de1274f29a96030dcb3811eb1c30206900b786d0657f2'
          assert os.environ['PLATFORM']=='windows-x64' and os.environ['RPM_ONLY']=='false'
          assert os.environ['SOURCE_RUN_ID']==str(run_id) and os.environ['EXPECTED_COMMIT']==commit
          def diagnostic_member_size(size):return type(size) is int and 0<size<=512*1024**2
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/anaxonda/burrata/'+path],timeout=30))
          run=api(f'actions/runs/{run_id}')
          assert run['head_sha']==commit and run['path']=='.github/workflows/release.yml'
          assert run['event']=='workflow_dispatch' and run['status']=='completed' and run['conclusion']=='failure'
          jobs=api(f'actions/runs/{run_id}/jobs?filter=latest&per_page=100')
          assert jobs['total_count']<=100
          windows=[j for j in jobs['jobs'] if j['name']=='build (x86_64-pc-windows-msvc, windows-2022, nsis, windows-x64)']
          assert len(windows)==1 and windows[0]['status']=='completed'
          steps={s['name']:s['conclusion'] for s in windows[0]['steps']}
          assert steps['Build native installer']=='success' and steps['Smoke-test the installed desktop artifact']=='failure'
          artifact=api(f'actions/artifacts/{artifact_id}')
          assert artifact['workflow_run']['id']==run_id and artifact['workflow_run']['head_sha']==commit
          assert artifact['name']=='debug-installer-windows-x64-'+commit and not artifact['expired']
          assert artifact['size_in_bytes']==344839864 and artifact['digest']=='sha256:'+digest
          archive=pathlib.Path('.cache/windows-diagnostic-installer.zip')
          with archive.open('wb') as output:
              result=subprocess.run(['gh','api',f'repos/anaxonda/burrata/actions/artifacts/{artifact_id}/zip'],stdout=output,stderr=subprocess.PIPE,timeout=120)
          assert result.returncode==0 and archive.stat().st_size==artifact['size_in_bytes']
          with archive.open('rb') as stream:assert hashlib.file_digest(stream,'sha256').hexdigest()==digest
          destination=pathlib.Path('.cache/windows-diagnostic-installer');destination.mkdir()
          with zipfile.ZipFile(archive) as zipped:
              members=[m for m in zipped.infolist() if not m.is_dir()]
              assert len(members)==1 and members[0].filename=='Burrata_0.1.25_x64-setup.exe'
              member=members[0];assert stat.S_IFMT(member.external_attr>>16)!=stat.S_IFLNK
              assert diagnostic_member_size(member.file_size)
              installer=destination/member.filename
              with zipped.open(member) as source,installer.open('xb') as target:
                  while data:=source.read(1024*1024):target.write(data)
          assert installer.stat().st_size==member.file_size
          with installer.open('rb') as stream:installer_sha=hashlib.file_digest(stream,'sha256').hexdigest()
          proof={'diagnosticOnly':True,'qualificationStatus':'UNQUALIFIED','producerConclusion':'failure','producerRunId':run_id,'producerCommit':commit,'producerWorkflow':run['path'],'windowsBuildStepPassed':True,'artifactId':artifact_id,'artifactZipSha256':digest,'archiveDigestMatched':True,'inventorySource':'Derived from exact verified debug archive; no successful release inventory exists','inventory':[{'file':member.filename,'bytes':member.file_size,'sha256':installer_sha}]}
          (root/'producer-provenance.json').write_text(json.dumps(proof,indent=2)+'\n')
      - name: Read only Windows audio services and default render endpoint
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $report=@{diagnosticOnly=$true;qualificationStatus='UNQUALIFIED';services=@{}}
          foreach($name in @('AudioSrv','AudioEndpointBuilder')) {
            try {$service=Get-Service -Name $name -ErrorAction Stop;$report.services[$name]=@{state=$service.Status.ToString()}}
            catch {$report.services[$name]=@{state='unavailable';hresult=$_.Exception.HResult}}
          }
          try {
            Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class RenderEndpointProbe {
            [ComImport,Guid("A95664D2-9614-4F35-A746-DE8DB63617E6"),InterfaceType(ComInterfaceType.InterfaceIsIUnknown)]
            interface Enumerator {
              [PreserveSig] int EnumAudioEndpoints(int flow,uint states,out Collection devices);
              [PreserveSig] int GetDefaultAudioEndpoint(int flow,int role,out IntPtr device);
            }
            [ComImport,Guid("0BD7A1BE-7A1A-44DB-8397-CC5392387B5E"),InterfaceType(ComInterfaceType.InterfaceIsIUnknown)]
            interface Collection {[PreserveSig] int GetCount(out uint count);}
            public static int[] Read() {
              object instance=null;Collection devices=null;IntPtr endpoint=IntPtr.Zero;
              try {
                instance=Activator.CreateInstance(Type.GetTypeFromCLSID(new Guid("BCDE0395-E52F-467C-8E3D-C4579291692E")));
                var enumerator=(Enumerator)instance;int list=enumerator.EnumAudioEndpoints(0,1,out devices);
                uint count=0;int countResult=list>=0?devices.GetCount(out count):list;
                int primary=enumerator.GetDefaultAudioEndpoint(0,0,out endpoint);
                return new int[]{0,list,countResult,(int)count,primary,endpoint!=IntPtr.Zero?1:0};
              } catch(Exception error) {return new int[]{error.HResult,0,0,0,0,0};}
              finally {if(endpoint!=IntPtr.Zero)Marshal.Release(endpoint);if(devices!=null)Marshal.ReleaseComObject(devices);if(instance!=null)Marshal.ReleaseComObject(instance);}
            }
          }
          '@ -ErrorAction Stop
            $v=[RenderEndpointProbe]::Read()
            $report.render=@{activationHresult=$v[0];enumerateActiveHresult=$v[1];countHresult=$v[2];activeRenderCount=$v[3];defaultConsoleHresult=$v[4];defaultConsoleExists=($v[5] -eq 1)}
          } catch {$report.render=@{probeStatus='unavailable';hresult=$_.Exception.HResult}}
          $report|ConvertTo-Json -Depth 5|Set-Content .cache/windows-diagnostic/os-audio.json
      - run: npm ci --ignore-scripts
      - name: Muted diagnostic only; retain failure before cleanup
        shell: bash
        run: |
          python scripts/release/smoke-installed.py --windows-diagnostic \
            --installer .cache/windows-diagnostic-installer/Burrata_0.1.25_x64-setup.exe \
            --evidence .cache/windows-diagnostic/native-diagnostic.json \
            --source-run-id 41349273407 --source-commit 3cf3b1a48709c4a102f7e06ac2ea6b15059b19b4 \
            --harness-commit '${{ github.sha }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-native-diagnostic-only-${{ github.sha }}
          path: .cache/windows-diagnostic/*.json
          if-no-files-found: error
          retention-days: 14
