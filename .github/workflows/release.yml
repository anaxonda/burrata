name: Tagged desktop prerelease

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag; leave blank to qualify the current main commit
        type: string
        required: false
        default: ''
      extensions_only:
        description: Run Firefox/Chromium extension qualification only (no desktop builds or draft)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      publish_draft: ${{ steps.meta.outputs.publish_draft }}
      extensions_only: ${{ steps.meta.outputs.extensions_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.tag || 'main') || github.ref }}
          fetch-depth: 0
      - id: meta
        name: Validate source commit and package versions
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (github.event_name == 'push' && github.ref_name || '') }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          EXTENSIONS_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.extensions_only || false }}
        run: |
          set -euo pipefail
          head_commit="$(git rev-parse HEAD)"
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -e "console.log(require('./src-tauri/tauri.conf.json').version)")"
          cargo_version="$(sed -n 's/^version = \"\([^\"]*\)\"/\1/p' src-tauri/Cargo.toml | head -1)"
          test "$package_version" = "$tauri_version"
          test "$package_version" = "$cargo_version"
          if [[ "$EXTENSIONS_ONLY" == "true" ]]; then
            test "$WORKFLOW_EVENT" = workflow_dispatch
            if [[ -n "$REQUESTED_TAG" ]]; then
              echo "extensions_only cannot be combined with a release tag" >&2
              exit 1
            fi
          fi
          if [[ -z "$REQUESTED_TAG" ]]; then
            test "$WORKFLOW_EVENT" = workflow_dispatch
            main_commit="$(git rev-parse refs/remotes/origin/main^{commit})"
            test "$head_commit" = "$main_commit"
            artifact_tag="build-$head_commit"
            version="$package_version"
            publish_draft=false
          else
            [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
            tag_commit="$(git rev-parse "refs/tags/$REQUESTED_TAG^{commit}")"
            test "$tag_commit" = "$head_commit"
            version="${REQUESTED_TAG#v}"
            test "$package_version" = "$version"
            artifact_tag="$REQUESTED_TAG"
            publish_draft=true
          fi
          echo "tag=$artifact_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$head_commit" >> "$GITHUB_OUTPUT"
          echo "publish_draft=$publish_draft" >> "$GITHUB_OUTPUT"
          echo "extensions_only=$EXTENSIONS_ONLY" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.extensions_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
            bundles: dmg
            label: macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            bundles: nsis
            label: windows-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
            label: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: npm
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.13'
      - name: Require the intended native runner architecture
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          case "$TARGET" in
            aarch64-apple-darwin) test "$(uname -m)" = arm64 ;;
            x86_64-unknown-linux-gnu) test "$(uname -m)" = x86_64 ;;
            *) echo "Unexpected target $TARGET on $(uname -m)" >&2; exit 1 ;;
          esac
      - name: Require x64 Windows runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') { throw "Expected AMD64 runner, got $env:PROCESSOR_ARCHITECTURE" }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Install Linux bundle prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl dbus-x11 file gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav libasound2-dev libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev nasm patchelf perl pulseaudio rpm libfuse2 xvfb
      - name: Prepare and validate the Linux AppImage runtime
        if: runner.os == 'Linux'
        run: python3 scripts/release/prepare-appimage-config.py --output .cache/appimage-config.json
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf
      - run: npm ci
      - name: Check installed-smoke path handling
        run: python3 scripts/release/test_smoke_installed.py
      - name: Check installed WebView audio smoke protocol
        run: node --test scripts/release/webview-audio-protocol.test.mjs
      - name: Check pinned media source-build contract
        run: python3 scripts/release/test-media-build-contract.py
      - name: Restore verified prepared tool runtimes
        id: prepared-tools-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/prepared-tool-resources/${{ matrix.target }}
          key: prepared-tools-v1-${{ matrix.target }}-${{ hashFiles('scripts/release/locked-tools.json', 'scripts/release/prepare-tools.py', 'scripts/release/verify-media-tool-build.py', 'scripts/release/build-*-media-tools.py', 'scripts/release/build-media-tools-common.py', 'scripts/release/test-media-tools.py') }}
      - name: Restore hash-locked media source archives
        id: media-sources-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/media-tool-sources
          key: media-source-v1-${{ matrix.target }}-${{ hashFiles('scripts/release/locked-tools.json') }}
      - name: Download and verify pinned runtime tools (macOS/Linux)
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/release/prepare-tools.py
      - name: Download and verify pinned runtime tools (Windows MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          TARGET: ${{ matrix.target }}
          PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        run: |
          python_exe="$(cygpath -u "$PYTHON_PATH")"
          export BURRATA_MSYS2_BASH="$(cygpath -w /usr/bin/bash.exe)"
          test -f "$(cygpath -u "$BURRATA_MSYS2_BASH")"
          "$python_exe" scripts/release/prepare-tools.py
      - name: Reverify prepared media runtime before caching
        id: verify-media-tools
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/release/verify-media-tool-build.py ${{ matrix.target }}
      - name: Save verified prepared tool runtimes
        if: success() && steps.verify-media-tools.outcome == 'success' && steps.prepared-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/prepared-tool-resources/${{ matrix.target }}
          key: prepared-tools-v1-${{ matrix.target }}-${{ hashFiles('scripts/release/locked-tools.json', 'scripts/release/prepare-tools.py', 'scripts/release/verify-media-tool-build.py', 'scripts/release/build-*-media-tools.py', 'scripts/release/build-media-tools-common.py', 'scripts/release/test-media-tools.py') }}
      - name: Save hash-locked media source archives
        if: success() && steps.verify-media-tools.outcome == 'success' && steps.media-sources-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/media-tool-sources
          key: media-source-v1-${{ matrix.target }}-${{ hashFiles('scripts/release/locked-tools.json') }}
      - name: Add prepared media tools to PATH for native tests
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 -c 'import os, pathlib; p = pathlib.Path("src-tauri/resources/tools") / os.environ["TARGET"]; open(os.environ["GITHUB_PATH"], "a", encoding="utf-8").write(str(p.resolve()) + os.linesep)'
      - name: Stage verified fpcalc for Linux or Windows
        if: runner.os != 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/release/prepare-fpcalc.py
      - name: Build pinned BgUtils helper and plugin
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          node_bin="src-tauri/resources/tools/$TARGET/node"
          [[ "$RUNNER_OS" == Windows ]] && node_bin+=".exe"
          NODE_BIN="$node_bin" bash scripts/youtube-support/prepare-bgutil.sh src-tauri/resources
      - name: Package pinned YouTube support plugin
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/release/package-youtube-support.py
      - name: Build and stage native helpers
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          npm run build
          cargo build --locked --release --target "$TARGET" --features custom-protocol --manifest-path src-tauri/Cargo.toml --bin burrata-browser-host --bin burrata-mcp
          cargo build --locked --release --target "$TARGET" --manifest-path src-tauri/recognizer/Cargo.toml --bin burrata-recognize
          node scripts/build_mcp.mjs
          bash scripts/release/prepare-native-resources.sh
      - name: Audit source and contracts
        shell: bash
        run: |
          python3 scripts/test_audit_secrets.py
          python3 scripts/audit_secrets.py
          python3 scripts/check_contracts.py
      - run: npm run check
      - run: npm test
      - run: npm run test:extension
      - name: Provider worker and private auth protocol fixtures
        run: node --test scripts/provider-session-worker.test.mjs scripts/youtube-session-worker.test.mjs scripts/provider-session-auth-cache.test.mjs
      - run: npm run test:mcp
      - run: npm run test:player
      - name: Check isolated launcher boundaries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash scripts/dev/tests/process-profile-guard.test.sh
          bash scripts/dev/tests/automation-ready.test.sh
          bash scripts/dev/tests/isolated-music-root.test.sh
      - name: Decode deterministic native playback fixture without audio hardware
        run: python3 scripts/release/test-native-playback-contract.py
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
        timeout-minutes: 45
        # Public-provider qualification is an explicit live run. Unit fixtures
        # must not fall through to YouTube when they exercise fake helpers.
        env:
          BURRATA_NATIVE_YOUTUBE_SEARCH: '0'
          BURRATA_DIRECT_YOUTUBE: '0'
          BURRATA_BANDCAMP_PLAYBACK: '0'
      - name: Build native installer
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          extra=()
          if [[ "$TARGET" = x86_64-unknown-linux-gnu ]]; then
            test -s .cache/appimage-config.json
            extra=(--config "$PWD/.cache/appimage-config.json")
          fi
          npm run tauri -- build --target "$TARGET" --bundles "$BUNDLES" "${extra[@]}"
      - name: Smoke-test the installed desktop artifact
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bundle_dir="src-tauri/target/$TARGET/release/bundle"
          case "$TARGET" in
            aarch64-apple-darwin) pattern='*.dmg' ;;
            x86_64-pc-windows-msvc) pattern='*.exe' ;;
            x86_64-unknown-linux-gnu) pattern='*.deb' ;;
            *) echo "Unsupported smoke-test target: $TARGET" >&2; exit 1 ;;
          esac
          installer="$(find "$bundle_dir" -type f -name "$pattern" -print -quit)"
          test -n "$installer"
          python3 scripts/release/smoke-installed.py --installer "$installer" --evidence .cache/release-smoke-evidence.json
      - name: Smoke-test the AppImage launcher and bundled WebView audio
        if: runner.os == 'Linux'
        shell: bash
        run: |
          installer="$(find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle -type f -name '*.AppImage' -print -quit)"
          test -n "$installer"
          python3 scripts/release/smoke-installed.py --installer "$installer" --evidence .cache/appimage-smoke-evidence.json
      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('.cache/release-smoke-evidence.json') != ''
        with:
          name: smoke-evidence-${{ matrix.label }}-${{ needs.prepare.outputs.commit }}
          path: |
            .cache/release-smoke-evidence.json
            .cache/appimage-smoke-evidence.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Collect installers, provenance, and checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          TARGET: ${{ matrix.target }}
          LABEL: ${{ matrix.label }}
        run: bash scripts/release/collect-artifacts.sh
      - uses: actions/upload-artifact@v7
        with:
          name: burrata-${{ matrix.label }}-${{ needs.prepare.outputs.commit }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve installer for smoke diagnostics on failure
        if: failure()
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/$TARGET/release/bundle"
          destination=.cache/debug-installer
          mkdir -p "$destination"
          case "$TARGET" in
            aarch64-apple-darwin) find "$bundle_dir" -type f -name '*.dmg' -exec cp {} "$destination/" \; 2>/dev/null || true ;;
            x86_64-pc-windows-msvc) find "$bundle_dir" -type f -name '*.exe' -exec cp {} "$destination/" \; 2>/dev/null || true ;;
            x86_64-unknown-linux-gnu) find "$bundle_dir" -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} "$destination/" \; 2>/dev/null || true ;;
          esac
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: debug-installer-${{ matrix.label }}-${{ needs.prepare.outputs.commit }}
          path: .cache/debug-installer/*
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

  extension:
    needs: prepare
    if: needs.prepare.outputs.publish_draft == 'true' || needs.prepare.outputs.extensions_only == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
      - run: npm ci
      - name: Build Chromium extension ZIP
        run: |
          python3 scripts/build_browser_extension.py
          mkdir -p release-artifacts
          cd .cache/browser-companion-chromium
          zip -qr ../../release-artifacts/burrata-chromium.zip .
      - name: Test Firefox signing reuse guards
        run: |
          python3 scripts/release/test_sign_firefox.py
          python3 scripts/release/test_collect_extension.py
      - name: Build and sign Firefox extension (AMO unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: python3 scripts/release/sign-firefox.py --source-dir extension --artifacts-dir release-artifacts
      - name: Package extension provenance
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: bash scripts/release/collect-extension.sh
      - uses: actions/upload-artifact@v7
        with:
          name: burrata-extensions-${{ needs.prepare.outputs.commit }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

  draft:
    needs: [prepare, build, extension]
    if: needs.prepare.outputs.publish_draft == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@v5
        with:
          pattern: burrata-*-${{ needs.prepare.outputs.commit }}
          path: incoming
          merge-multiple: false
      - name: Check installer and supporting-download separation
        run: python3 scripts/release/test-feed-assembly.py
      - name: Validate complete artifact set and assemble draft bundle
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: bash scripts/release/assemble-draft.sh
      - name: Create draft prerelease only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-artifacts/*)
          support_assets=(support-artifacts/*)
          test "${#assets[@]}" = 8
          test "${#support_assets[@]}" -gt 0
          support_url="$(gh release create "support-$RELEASE_TAG" "${support_assets[@]}" --draft --prerelease --target "$RELEASE_COMMIT" --title "Burrata $RELEASE_TAG supporting downloads" --notes "Optional helper updates, matching dependency sources, licenses and acceptance evidence for Burrata $RELEASE_TAG. Source commit: $RELEASE_COMMIT. Main installers and browser companions are on the repository Releases page. This draft is not automatically published.")"
          gh release create "$RELEASE_TAG" "${assets[@]}" --draft --prerelease --verify-tag --title "Burrata $RELEASE_TAG" --generate-notes --notes "Choose your platform's main installer or browser companion below; required runtime helpers are bundled with the installers. Optional helper updates, matching dependency sources, licenses and verification records: $support_url"
