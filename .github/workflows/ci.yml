name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl ffmpeg file gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav libasound2-dev libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf rpm libfuse2
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress --yes
      - run: npm ci
      - name: Check installed-smoke path handling
        run: python scripts/release/test_smoke_installed.py
      - name: Check installed WebView audio smoke protocol
        run: node --test scripts/release/webview-audio-protocol.test.mjs
      - name: Check installer and supporting-download separation
        if: runner.os == 'Linux'
        run: python3 scripts/release/test-feed-assembly.py
      - name: Audit source for common secrets
        run: |
          python3 scripts/test_audit_secrets.py
          python3 scripts/audit_secrets.py
        if: runner.os != 'Windows'
      - name: Audit source for common secrets (Windows)
        run: |
          python scripts/test_audit_secrets.py
          python scripts/audit_secrets.py
        if: runner.os == 'Windows'
      - run: python3 scripts/check_contracts.py
        if: runner.os != 'Windows'
      - run: python scripts/check_contracts.py
        if: runner.os == 'Windows'
      - name: Check playback benchmark statistics
        run: python -m unittest discover -s scripts/performance -p "test_*.py"
      - name: Check asset-backed library fixture and launcher bounds
        if: runner.os == 'Linux'
        run: python -m unittest discover -s scripts/performance/tests -p "test_*.py"
      - name: Playback measurement validity tests
        run: node --test scripts/performance/playback_progress.test.mjs scripts/performance/imported_playback_case.test.mjs scripts/performance/sustained_playback.test.mjs scripts/performance/sasa_qualification_manifest.test.mjs scripts/performance/tests/library_page_matrix_boundaries.test.mjs
      - name: Check isolated launcher profile handling
        if: runner.os == 'Linux'
        run: |
          bash scripts/dev/tests/process-profile-guard.test.sh
          bash scripts/dev/tests/isolated-music-root.test.sh
          bash scripts/dev/tests/automation-ready.test.sh
      - name: Check compiled frontend readiness fixtures
        timeout-minutes: 2
        run: node --test --test-timeout=30000 scripts/dev/tests/verify-frontend-modules.test.mjs
      - name: Check anonymous player preparation and profile fixtures
        timeout-minutes: 2
        run: node --test --test-timeout=30000 scripts/performance/innertube/client_factory.test.mjs scripts/performance/innertube/visionos_probe.test.mjs
      - name: Check isolated InnerTube prototype without provider requests
        # Decoder accounting uses Python resource/wait4 and a /bin/sh fixture.
        # Token fixtures also use POSIX file-URL pathnames for their fake module.
        if: runner.os != 'Windows'
        timeout-minutes: 3
        run: node --test --test-timeout=30000 scripts/performance/innertube/core.test.mjs scripts/performance/innertube/token.test.mjs
      - name: Check offline InnerTube experiment driver fixtures
        # Fake subprocesses exercise POSIX groups and select on pipe descriptors.
        if: runner.os == 'Linux'
        timeout-minutes: 3
        env:
          PYTHONPATH: scripts/performance/innertube
        run: python3 -m unittest test_player_cache_reuse test_seek_durability test_cold_player_overlap test_visionos_driver
      - run: npm run check
      - run: npm test
      - run: npm run test:extension
      - name: Provider worker and private auth protocol fixtures
        run: node --test scripts/provider-session-worker.test.mjs scripts/youtube-session-worker.test.mjs scripts/provider-session-auth-cache.test.mjs
      - run: npm run test:mcp
      - run: npm run test:player
      - run: npm run build
      - run: npm run build:mcp
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Decode native playback fixture without audio hardware
        run: python3 scripts/release/test-native-playback-contract.py
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Diagnose Windows native loader failure
        timeout-minutes: 10
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install pefile
          $testExe = Get-ChildItem src-tauri/target/debug/deps/burrata_lib-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($testExe) {
            python scripts/release/diagnose-windows-loader.py $testExe.FullName > windows-loader-imports.json
            $report = Get-Content windows-loader-imports.json -Raw | ConvertFrom-Json
            $report.missing | ConvertTo-Json -Depth 8
          }
      - uses: actions/upload-artifact@v7
        if: failure() && runner.os == 'Windows'
        with:
          name: windows-loader-diagnostics-${{ github.sha }}
          path: windows-loader-imports.json
          if-no-files-found: ignore
          retention-days: 14

  linux-bundles:
    name: Linux configured bundle targets
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Install Linux bundle prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl dbus-x11 file gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav libasound2-dev libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev nasm perl patchelf pulseaudio rpm libfuse2 xvfb
      - run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Restore verified Linux tool runtime
        id: prepared-tools-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/prepared-tool-resources/x86_64-unknown-linux-gnu
          key: prepared-tools-v1-x86_64-unknown-linux-gnu-${{ hashFiles('scripts/release/locked-tools.json', 'scripts/release/prepare-tools.py', 'scripts/release/verify-media-tool-build.py', 'scripts/release/build-*-media-tools.py', 'scripts/release/build-media-tools-common.py', 'scripts/release/test-media-tools.py') }}
      - name: Restore hash-locked Linux media sources
        id: media-sources-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/media-tool-sources
          key: media-source-v1-x86_64-unknown-linux-gnu-${{ hashFiles('scripts/release/locked-tools.json') }}
      - name: Prepare the same locked Linux tool runtime used by releases
        env:
          TARGET: x86_64-unknown-linux-gnu
        run: python3 scripts/release/prepare-tools.py
      - name: Reverify prepared Linux media runtime before caching
        id: verify-media-tools
        env:
          TARGET: x86_64-unknown-linux-gnu
        run: python3 scripts/release/verify-media-tool-build.py "$TARGET"
      - name: Save verified Linux tool runtime
        if: success() && steps.verify-media-tools.outcome == 'success' && steps.prepared-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/prepared-tool-resources/x86_64-unknown-linux-gnu
          key: prepared-tools-v1-x86_64-unknown-linux-gnu-${{ hashFiles('scripts/release/locked-tools.json', 'scripts/release/prepare-tools.py', 'scripts/release/verify-media-tool-build.py', 'scripts/release/build-*-media-tools.py', 'scripts/release/build-media-tools-common.py', 'scripts/release/test-media-tools.py') }}
      - name: Save hash-locked Linux media source archives
        if: success() && steps.verify-media-tools.outcome == 'success' && steps.media-sources-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/media-tool-sources
          key: media-source-v1-x86_64-unknown-linux-gnu-${{ hashFiles('scripts/release/locked-tools.json') }}
      - name: Stage the remaining locked Linux runtime resources
        env:
          TARGET: x86_64-unknown-linux-gnu
        run: |
          python3 scripts/release/prepare-fpcalc.py
          NODE_BIN="src-tauri/resources/tools/$TARGET/node" bash scripts/youtube-support/prepare-bgutil.sh src-tauri/resources
      - name: Build native helpers and complete packaged resources
        env:
          TARGET: x86_64-unknown-linux-gnu
        run: |
          npm run build
          cargo build --locked --release --target "$TARGET" --features custom-protocol --manifest-path src-tauri/Cargo.toml --bin burrata-browser-host --bin burrata-mcp
          cargo build --locked --release --target "$TARGET" --manifest-path src-tauri/recognizer/Cargo.toml --bin burrata-recognize
          npm run build:mcp
          bash scripts/release/prepare-native-resources.sh
      - name: Build configured Tauri bundles
        run: npm run tauri -- build --target x86_64-unknown-linux-gnu --bundles deb,rpm,appimage
      - name: Smoke-test the installed Linux desktop package
        run: |
          installer="$(find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle -type f -name '*.deb' -print -quit)"
          test -n "$installer"
          python3 scripts/release/smoke-installed.py --installer "$installer" --evidence .cache/release-smoke-evidence.json
      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('.cache/release-smoke-evidence.json') != ''
        with:
          name: linux-smoke-evidence-${{ github.sha }}
          path: .cache/release-smoke-evidence.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Collect packages and checksums
        run: |
          bundle_dir=src-tauri/target/x86_64-unknown-linux-gnu/release/bundle
          test -n "$(find "$bundle_dir" -type f -name '*.deb' -print -quit)"
          test -n "$(find "$bundle_dir" -type f -name '*.rpm' -print -quit)"
          test -n "$(find "$bundle_dir" -type f -name '*.AppImage' -print -quit)"
          mkdir release-artifacts
          find "$bundle_dir" -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} release-artifacts/ \;
          cp .cache/release-smoke-evidence.json release-artifacts/smoke-evidence.json
          (cd release-artifacts && sha256sum *.deb *.rpm *.AppImage smoke-evidence.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: burrata-linux-${{ github.sha }}
          path: |
            release-artifacts/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve Linux installers for smoke diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir=src-tauri/target/x86_64-unknown-linux-gnu/release/bundle
          destination=.cache/debug-installer
          mkdir -p "$destination"
          find "$bundle_dir" -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} "$destination/" \; 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: debug-installer-linux-x64-${{ github.sha }}
          path: .cache/debug-installer/*
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
