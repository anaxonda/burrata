[package]
name = "burrata-recognizer"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[[bin]]
name = "burrata-recognize"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
byteorder = "1"
crc32fast = "1"
hound = "3.5"
realfft = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustfft = "6.4"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
