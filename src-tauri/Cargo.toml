[package]
name = "burrata"
default-run = "burrata"
version = "0.1.19"
description = "Local-first DJ music discovery and acquisition"
edition = "2021"
license = "GPL-3.0-or-later"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
experimental-opus = ["dep:symphonia-experiment", "dep:symphonia-opus-adapter"]
# Diagnostic-only early playback verification overlap experiment. Disabled in
# ordinary builds; additionally requires BURRATA_PLAYBACK_EARLY_CANDIDATE_EXPERIMENT=1.
playback-early-candidate-experiment = []
# Compatibility feature for existing qualification commands. Known-source direct
# HTTP playback is now compiled by default; BURRATA_DIRECT_YOUTUBE=0 disables it.
playback-direct-youtube-experiment = []

[lib]
name = "burrata_lib"
# Desktop executables link this Rust library directly.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"
cmake = "0.1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
log = "=0.4.34"
tauri-plugin-dialog = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled", "collation", "functions", "backup"] }
icu_collator = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_locale_core = { version = "=2.3.0", features = ["alloc"] }
scraper = "0.22"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
thiserror = "2"
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }
lofty = "0.22"
url = "2"
futures-util = "0.3"
csv = "1"
strsim = "0.11"
libc = "0.2"
axum = "0.8"
dirs = "7"
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
notify = "8.2"

rodio = { version = "=0.22.2", default-features = false, features = ["playback", "symphonia-all"] }
stream-download = { version = "=0.24.4", default-features = false, features = ["http", "reqwest", "reqwest-rustls", "temp-storage"] }
symphonia-experiment = { package = "symphonia", version = "=0.5.5", default-features = false, features = ["all-formats", "all-codecs"], optional = true }
symphonia-opus-adapter = { package = "symphonia-adapter-libopus", version = "=0.2.9", default-features = false, features = ["bundled"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"
cairo-rs = { version = "0.18", features = ["png"] }
zbus = { version = "4.4", default-features = false, features = ["tokio"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
souvlaki = { version = "=0.8.3", default-features = false }

[profile.release]
strip = "debuginfo"
lto = "thin"

[profile.dev]
debug = 1

[profile.test]
debug = 0

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[patch.crates-io]
# Keep strict byte-range validation while fixing upstream's sparse-seek gap selection.
stream-download = { path = "vendor/stream-download" }
