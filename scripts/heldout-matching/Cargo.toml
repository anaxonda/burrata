[package]
name = "burrata-heldout-matching"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
uuid = { version = "1", features = ["v4"] }
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
